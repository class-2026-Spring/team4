<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>분리배출 OX 미니게임</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="game-section" aria-labelledby="game-title">
        <header class="section-head">
          <div>
            <p class="eyebrow">생활 속 분리배출</p>
            <h1 id="game-title">헷갈리는 분리배출 OX 퀴즈</h1>
          </div>
          <div class="page-actions">
            <a class="page-link" href="sorting-game.html">캐치 미니게임</a>
            <a class="page-link" href="jeju.html">제주 페이지로 돌아가기</a>
            <a class="page-link" href="index.html">전국 지도 보기</a>
          </div>
        </header>

        <section class="game-board" aria-live="polite">
          <div class="quiz-status">
            <span id="quiz-progress">1 / 8</span>
            <strong id="quiz-score">0점</strong>
          </div>

          <article class="quiz-card">
            <div class="trash-visual" aria-hidden="true">
              <span id="quiz-icon">?</span>
            </div>
            <p class="eyebrow" id="quiz-item">품목</p>
            <h2 id="quiz-question">문제를 불러오는 중입니다.</h2>
            <div class="ox-actions">
              <button class="ox-button is-o" type="button" data-answer="true">O</button>
              <button class="ox-button is-x" type="button" data-answer="false">X</button>
            </div>
          </article>

          <section class="feedback-panel" id="feedback-panel" hidden>
            <p class="feedback-result" id="feedback-result"></p>
            <p id="feedback-text"></p>
            <button class="next-button" id="next-button" type="button">다음 문제</button>
          </section>
        </section>

        <section class="result-panel" id="result-panel" hidden>
          <p class="eyebrow">퀴즈 결과</p>
          <h2 id="result-title">결과</h2>
          <p id="result-summary"></p>
          <div id="review-list" class="review-list"></div>
          <button class="next-button" id="restart-button" type="button">다시 풀기</button>
        </section>

        <section class="insight-band" aria-label="게임 안내">
          <h3>게임의 의미</h3>
          <p id="game-notice">
            실생활에서 헷갈리는 품목을 OX로 확인하면서, 데이터 시각화가 실제 분리배출 행동으로 이어질 수 있도록 구성했습니다.
          </p>
        </section>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
